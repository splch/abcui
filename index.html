<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABC UI</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; font-family: sans-serif; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
<p>Starting Python in your browser…</p>
<iframe></iframe>
<script type="module">
  const python = new SharedWorker('worker.js', {type: 'module', extendedLifetime: true});
  navigator.serviceWorker.onmessage = ({data, ports}) => python.port.postMessage(data, ports);
  await navigator.serviceWorker.register('sw.js');
  await navigator.serviceWorker.ready;
  document.querySelector('iframe').src = 'app/';
</script>
